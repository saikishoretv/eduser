<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body {
    width: 280px;
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 12px;
    user-select: none;
  }
  .header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid #1f1f1f;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo {
    width: 18px; height: 18px;
    background: #6d28d9;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  .header-title { font-size: 11px; font-weight: 600; color: #a3a3a3; text-transform: uppercase; letter-spacing: .06em }

  .status-bar {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #1a1a1a;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #404040; flex-shrink: 0;
    transition: background .3s;
  }
  .dot.recording { background: #ef4444; animation: pulse 1.5s ease-in-out infinite }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .status-text { color: #737373; font-size: 11px }
  .timer { margin-left: auto; font-variant-numeric: tabular-nums; color: #525252; font-size: 11px }

  .steps-area {
    max-height: 160px;
    overflow-y: auto;
    border-bottom: 1px solid #1a1a1a;
  }
  .steps-area:empty { display: none }
  .step-item {
    padding: 7px 14px;
    border-bottom: 1px solid #141414;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .step-item:last-child { border-bottom: none }
  .step-icon { font-size: 9px; color: #525252; margin-top: 1px; flex-shrink: 0 }
  .step-title { color: #a3a3a3; line-height: 1.4; font-size: 11px }

  .actions { padding: 12px 14px }
  .btn {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, background .15s;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed }
  .btn-start { background: #6d28d9; color: #fff }
  .btn-start:hover:not(:disabled) { background: #7c3aed }
  .btn-stop { background: #1f1f1f; color: #ef4444; border: 1px solid #2a2a2a }
  .btn-stop:hover:not(:disabled) { background: #2a1515 }

  .msg { padding: 0 14px 12px; color: #737373; font-size: 11px; line-height: 1.5 }
  .msg.error { color: #ef4444 }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">E</div>
    <span class="header-title">Eduser Recorder</span>
  </div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span class="status-text" id="statusText">Ready to record</span>
    <span class="timer" id="timer"></span>
  </div>

  <div class="steps-area" id="stepsArea"></div>

  <div class="actions">
    <button class="btn btn-start" id="btnStart">Start Recording</button>
    <button class="btn btn-stop" id="btnStop" style="display:none">Stop Recording</button>
  </div>

  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
